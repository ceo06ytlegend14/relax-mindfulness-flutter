<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#001B24">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <title>Sanctuary · You’re offline</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); color: #f5fafa; background: radial-gradient(ellipse at 50% 20%, #0b3d43, #001b24 65%); font: 16px/1.6 system-ui, sans-serif; }
    main { width: 100%; max-width: 430px; text-align: center; }
    svg { width: 72px; height: 72px; color: #78eed0; margin-bottom: 20px; }
    .eyebrow { color: #78eed0; font-size: 12px; font-weight: 600; letter-spacing: 3px; }
    h1 { margin: 14px 0; font-size: clamp(28px, 7vw, 36px); line-height: 1.2; letter-spacing: -1px; }
    p { margin: 12px 0; color: #b8d0d4; }
    button { margin-top: 20px; min-height: 48px; padding: 12px 30px; border: 1px solid #b0ffe6; border-radius: 100px; background: linear-gradient(135deg, #adffe7, #50d9bd); color: #002b26; font: 600 16px system-ui, sans-serif; cursor: pointer; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 5px; }
    small { display: block; margin-top: 28px; color: #86a9b2; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M32 6C16 21 16 37 32 51 48 37 48 21 32 6Z"/><path d="m19 25-13-6c-3 20 6 33 26 33 20 0 29-13 26-33l-13 6M32 52v7"/></svg>
    <p class="eyebrow">SANCTUARY</p>
    <h1>A little pause.<br>You’re offline.</h1>
    <p>Reconnect to open your sanctuary. Your saved settings are still kept in this browser.</p>
    <button id="retry" type="button">Try again</button>
    <small>This installation does not download the full app or audio library for offline use.</small>
  </main>
  <script>document.getElementById('retry').addEventListener('click', function () { window.location.reload(); });</script>
</body>
</html>
