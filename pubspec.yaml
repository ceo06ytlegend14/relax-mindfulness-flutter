name: relax_mindfulness
description: "Sanctuary: Relax & Mindfulness — Guided meditation, ambient sound mixer, breathing timer & sleep stories. Your daily calm companion."
publish_to: 'none'
# Version: major.minor.patch+buildNumber
# 1.1.0+5 — Volume shock prevention, multi-track headroom limiter & Apple StoreKit restore compliance
version: 1.1.0+5

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  just_audio: ^0.9.40
  audio_session: ^0.1.21
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  smooth_page_indicator: ^1.1.0
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  flutter_local_notifications: ^17.0.0
  in_app_review: ^2.0.9
  purchases_flutter: ^8.7.0
  google_generative_ai: ^0.4.3
  timezone: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  just_audio_platform_interface: any
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/mixer/
    - assets/images/meditate/
    - assets/images/player/
    - assets/images/sleep/
    - assets/fonts/mixer/OFL.txt
    - assets/fonts/editorial/OFL.txt
    - assets/sounds/
  fonts:
    - family: MixerSans
      fonts:
        - asset: assets/fonts/mixer/Roboto.ttf
    - family: SanctuarySerif
      fonts:
        - asset: assets/fonts/editorial/CormorantGaramond.ttf
