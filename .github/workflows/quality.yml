name: Quality checks

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:
    inputs:
      android_smoke:
        description: Also compile a debug Android APK (does not publish)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Browser, PWA and platform configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web

  flutter:
    name: Flutter analysis, tests and web compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - run: flutter --version
      - id: dependencies
        run: flutter pub get --enforce-lockfile
      # Still collect test/build results after an analyzer failure, without
      # suppressing that failure or turning a failed job green.
      # Legacy stylistic infos are advisory; errors and warnings still fail.
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: flutter analyze --no-fatal-infos
      - name: Format-check the new profile safety implementation and tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/models/user_backup.dart lib/screens/data_backup_screen.dart
          test/user_backup_test.dart test/user_backup_state_test.dart
          test/data_backup_screen_test.dart test/support/inert_audio_player.dart
          test/support/user_backup_fixture.dart
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: flutter test --reporter expanded
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: flutter build web --release

  android:
    name: Optional Android debug compilation
    if: github.event_name == 'workflow_dispatch' && inputs.android_smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0'
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug
